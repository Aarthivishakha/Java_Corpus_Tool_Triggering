AWSTemplateFormatVersion: "2010-09-09"
Description: Synthetic CloudFormation template (intentionally insecure). Not real infrastructure.
Resources:
  PublicBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: synthetic-cfn-public-bucket
      AccessControl: PublicRead
  OpenSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Synthetic open security group
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 3389
          ToPort: 3389
          CidrIp: 0.0.0.0/0
  UnencryptedVolume:
    Type: AWS::EC2::Volume
    Properties:
      AvailabilityZone: us-east-1a
      Size: 10
      Encrypted: false
